# fly.toml app configuration file generated for solbot1-iajzhw on 2026-05-18T18:36:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'solbot1-iajzhw'
primary_region = 'ams'

[build]

[deploy]
  strategy = 'immediate'

[[mounts]]
  source = 'sniper_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
